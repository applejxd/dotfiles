snippets:
  # tmuxinator - session management
  - name: "[tload] tmuxinator start session"
    keyword: "tload,"
    snippet: tmuxinator start {{session}}

  - name: "[tls] tmuxinator list sessions"
    keyword: "tls,"
    snippet: tmuxinator list

  - name: "[tdbg] tmuxinator debug session"
    keyword: "tdbg,"
    snippet: tmuxinator debug {{session}}

  # tmux - session management
  - name: "[tn] tmux new session"
    keyword: "tn,"
    snippet: tmux new-session -s {{session_name}}

  - name: "[ta] tmux attach session"
    keyword: "ta,"
    snippet: tmux attach-session -t {{session}}

  - name: "[tks] tmux kill session"
    keyword: "tks,"
    snippet: tmux kill-session -t {{session}}

  - name: "[tkw] tmux kill window"
    keyword: "tkw,"
    snippet: tmux kill-window -t {{window}}

  - name: "[tsls] tmux list sessions"
    keyword: "tsls,"
    snippet: tmux list-sessions

  - name: "[twls] tmux list windows"
    keyword: "twls,"
    snippet: tmux list-windows

  - name: "[tpls] tmux list panes"
    keyword: "tpls,"
    snippet: tmux list-panes

completions:
  # tmuxinator start completion from ~/.config/tmuxinator directory
  # Finds .yml and .yaml files and strips the extension
  - name: tmuxinator start session
    patterns:
      - "^tmuxinator (start|s|debug) $"
    sourceCommand: "find ~/.config/tmuxinator -maxdepth 1 -type f \\( -name '*.yml' -o -name '*.yaml' \\) -exec basename {} \\; 2>/dev/null | sed 's/\\.\\(yml\\|yaml\\)$//'"
    options:
      --prompt: "'tmuxinator Session> '"
      # Preview shows the actual session file content
      --preview: "if [ -f ~/.config/tmuxinator/{}.yml ]; then cat ~/.config/tmuxinator/{}.yml; elif [ -f ~/.config/tmuxinator/{}.yaml ]; then cat ~/.config/tmuxinator/{}.yaml; fi"

  # tmux attach completion
  - name: tmux attach session
    patterns:
      - "^tmux attach(-session)? -t $"
    sourceCommand: "tmux list-sessions -F '#{session_name}' 2>/dev/null"
    options:
      --prompt: "'tmux Session> '"

  # tmux kill session completion
  - name: tmux kill session
    patterns:
      - "^tmux kill-session -t $"
    sourceCommand: "tmux list-sessions -F '#{session_name}' 2>/dev/null"
    options:
      --multi: true
      --prompt: "'tmux Session> '"

  # tmux kill window completion
  - name: tmux kill window
    patterns:
      - "^tmux kill-window -t $"
    sourceCommand: "tmux list-windows -F '#{window_name}' 2>/dev/null"
    options:
      --multi: true
      --prompt: "'tmux Window> '"
