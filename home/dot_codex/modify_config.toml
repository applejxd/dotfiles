{{- /* chezmoi:modify-template */ -}}
{{- $common := includeTemplate "dot_config/agents/common.toml.tmpl" . | fromToml -}}
{{- $mcp := list -}}
{{- if hasKey $common "mcp" }}{{ range $common.mcp }}{{ if or (not (hasKey . "clis")) (has "codex" .clis) }}{{ $mcp = append $mcp . }}{{ end }}{{ end }}{{ end -}}
{{- $userConfig := .chezmoi.stdin | replaceAllRegex "(?s)^# chezmoi-managed:start.*?# chezmoi-managed:end(?:\\r?\\n)*" "" -}}
# chezmoi-managed:start
# see https://www.chezmoi.io/user-guide/manage-different-types-of-file/#manage-part-but-not-all-of-a-file
# see https://blog.s2n.tech/posts/codex-config-toml-chezmoi/

# see https://developers.openai.com/codex/config-basic

# コマンド実行を承認するかどうかをプロンプトで確認すべきタイミング
# - untrusted: 「信頼済み」でないコマンド（危険操作など）は実行前に都度承認を求める
# - on-request: モデル（Codex）が判断して承認を要求する場合
# - on-failure: コマンドが失敗した場合のみ承認にエスカレート
# - never: いかなる場合も承認を求めず、すべての操作を自動で実行
approval_policy = "untrusted"

# 最も安全（必要時のみ緩める）
sandbox_mode = "read-only"
# Web から最新情報を取得
web_search = "live"
model_reasoning_effort = "medium"
# pragmatic: 目的達成のために必要なだけの推論を行う
personality = "pragmatic"

# see https://developers.openai.com/codex/config-advanced#shell-environment-policy
[shell_environment_policy]
inherit = "core"
include_only = ["PATH","HOME","USER"]
exclude = ["AWS_*","AZURE_*","*TOKEN*","*SECRET*","*KEY*"]

[features]
multi_agent = true

[analytics]
enabled = false

[windows]
sandbox = "elevated"
{{ range $mcp }}
{{- /*
     管理ブロックの外に同名の [mcp_servers.<id>] があると TOML が重複宣言に
     なり、Codex は設定ファイル全体を読めなくなる。黙って壊すより apply を
     止めて、どちらを残すかをユーザに決めてもらう。
  */ -}}
{{- if regexMatch (printf "(?m)^\\[mcp_servers\\.%s\\]" .id) $userConfig }}
{{-   fail (printf "~/.codex/config.toml の管理ブロック外に [mcp_servers.%s] がある。common.toml と重複するのでどちらかを消すこと" .id) }}
{{- end }}
[mcp_servers.{{ .id }}]
enabled = true
{{- if eq .transport "http" }}
url = {{ .url | quote }}
{{- else if eq .transport "stdio" }}
command = {{ .command | quote }}
args = {{ index . "args" | default list | toJson }}
{{- else }}
{{-   fail (printf "[[mcp]] %s: transport %q は未対応" .id .transport) }}
{{- end }}
{{ end -}}
# chezmoi-managed:end
{{- .chezmoi.stdin | replaceAllRegex "(?s)^# chezmoi-managed:start.*?# chezmoi-managed:end(?:\\r?\\n)*" "\n\n" -}}
