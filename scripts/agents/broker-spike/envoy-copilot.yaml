# CHG-0037 段 U7a の使い捨ての設定 (Copilot を Envoy 経由で中継する)。
# @STATE@ は broker_spike.sh が、状態ディレクトリの絶対パスに置き換える。
# 試験の観点は docs/change/0037-pis-usability-and-telemetry.md の「認証の方針」と、段 U7。
node: {id: broker-spike, cluster: broker-spike}
static_resources:
  listeners:
    - name: copilot
      address:
        socket_address: {address: 127.0.0.1, port_value: 18080}
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: copilot
                normalize_path: true
                merge_slashes: true
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        text_format_source:
                          inline_string: "ACCESS %REQ(:METHOD)% %REQ(:PATH)% %RESPONSE_CODE%\n"
                stream_idle_timeout: 3600s
                route_config:
                  name: copilot
                  virtual_hosts:
                    - name: copilot
                      domains: ["*"]
                      routes:
                        # pis が起動前に身元を確かめる (上流へは出さない)
                        - match: {path: "/__pis_broker"}
                          direct_response:
                            status: 200
                            body: {inline_string: "pis-broker-copilot"}
                        # 内側から送れる要求は、観測した 3 つの POST だけ (CHG-0037)。それ以外は 403
                        - match: {path_separated_prefix: "/v1/messages", headers: [{name: ":method", string_match: {exact: POST}}]}
                          route: &upstream
                            cluster: copilot_upstream
                            timeout: 0s
                            idle_timeout: 3600s
                            host_rewrite_literal: "@HOST@"
                        - match: {path_separated_prefix: "/responses", headers: [{name: ":method", string_match: {exact: POST}}]}
                          route: *upstream
                        - match: {path_separated_prefix: "/chat/completions", headers: [{name: ":method", string_match: {exact: POST}}]}
                          route: *upstream
                        - match: {prefix: "/"}
                          direct_response:
                            status: 403
                            body: {inline_string: "pis-broker: path or method not allowed"}
                http_filters:
                  - name: envoy.filters.http.credential_injector
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.credential_injector.v3.CredentialInjector
                      overwrite: true
                      credential:
                        name: envoy.http.injected_credentials.generic
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.http.injected_credentials.generic.v3.Generic
                          header: Authorization
                          header_value_prefix: "Bearer "
                          credential:
                            name: copilot_token
                            sds_config:
                              path_config_source:
                                path: "@STATE@/copilot-sds.json"
                                watched_directory: {path: "@STATE@"}
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: copilot_upstream
      type: LOGICAL_DNS
      dns_lookup_family: V4_ONLY
      load_assignment:
        cluster_name: copilot_upstream
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: {address: "@HOST@", port_value: 443}
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          sni: "@HOST@"
