[project]
name = "powerpoint-studio-skill-tools"
version = "0.1.0"
description = "Deterministic QA and asset tools for the powerpoint-studio skill"
requires-python = ">=3.11"
dependencies = [
  "lxml>=5.3",
  "numpy>=2.1",
  "pdf2image>=1.17",
  "pillow>=11.0",
  "python-pptx>=1.0.2",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
