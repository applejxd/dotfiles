# yamllint disable rule:indentation
# (断片。envoy-base.yaml の中へ差し込むので、行頭がインデントされている)
# pis の GitHub ブローカー (設定 [pis.broker] github = "auto") の Envoy の断片 (リスナーとクラスタ)。
# 内側の gh が config.yml の http_unix_socket で、https://api.github.com/... を TLS なしでこのソケットへ送る。
# broker.py が起動ごとに、アットマークで囲んだ次の 3 つの名前を置き換えて、envoy-base.yaml へ差し込む。
#   SOCKET   リスナーの Unix ソケットの絶対パス (起動別の agent ディレクトリの gh.sock)
#   SDS_DIR  SDS ファイル gh-sds.json を置く状態ディレクトリの絶対パス
#   CA_FILE  上流の証明書を検証する CA バンドルの絶対パス (無ければ broker.py が起動を拒否する)
# 前半がリスナーの項目、後半 (区切りの行の後) がクラスタの項目。区切りの行を消さない。
    - name: github
      address:
        pipe: {path: "@SOCKET@", mode: 384}
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: github
                normalize_path: true
                merge_slashes: true
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        text_format_source:
                          inline_string: "ACCESS github %REQ(:METHOD)% %REQ(:AUTHORITY)% %REQ(:PATH)% %RESPONSE_CODE%\n"
                stream_idle_timeout: 3600s
                route_config:
                  name: github
                  virtual_hosts:
                    # 送れるのは api.github.com だけ。メソッドとパスは制限しない (操作の防御は PAT のスコープ)
                    - name: github
                      domains: ["api.github.com"]
                      routes:
                        - match: {prefix: "/"}
                          route:
                            cluster: github_upstream
                            timeout: 0s
                            idle_timeout: 3600s
                            host_rewrite_literal: "api.github.com"
                    # それ以外のホストは上流へ出さない (pis が起動前に身元を確かめるのにも使う)
                    - name: deny
                      domains: ["*"]
                      routes:
                        - match: {prefix: "/"}
                          direct_response:
                            status: 403
                            body: {inline_string: "pis-broker: host not allowed"}
                http_filters:
                  - name: envoy.filters.http.credential_injector
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.credential_injector.v3.CredentialInjector
                      overwrite: true
                      credential:
                        name: envoy.http.injected_credentials.generic
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.http.injected_credentials.generic.v3.Generic
                          header: Authorization
                          header_value_prefix: "Bearer "
                          credential:
                            name: gh_token
                            sds_config:
                              path_config_source:
                                path: "@SDS_DIR@/gh-sds.json"
                                watched_directory: {path: "@SDS_DIR@"}
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
# ---clusters---
    - name: github_upstream
      type: LOGICAL_DNS
      dns_lookup_family: V4_ONLY
      load_assignment:
        cluster_name: github_upstream
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: {address: "api.github.com", port_value: 443}
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          sni: "api.github.com"
          common_tls_context:
            validation_context:
              trusted_ca: {filename: "@CA_FILE@"}
              match_typed_subject_alt_names: [{san_type: DNS, matcher: {exact: "api.github.com"}}]
