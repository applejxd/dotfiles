# chezmoi の cold start 検証用サービス群。
#
# 使い方は test/README.md を参照。既定 (ubuntu2404) は従来どおり。
# 実機の Raspberry Pi は Ubuntu 22.04 / aarch64 なので、それに寄せた
# サービスを用意している。ただし **コンテナはホストのカーネルを共有する**
# ため、is-raspi の自動判定 (kernel.osrelease や /proc/device-tree/model)
# は再現できない。raspi サービスは IS_RASPI=1 で判定を注入する。
# see docs/change/closed/0008-raspi-branching.md

x-common: &common
  working_dir: /home/tester
  environment: &common-env
    TZ: Asia/Tokyo
    LANG: ja_JP.UTF-8
    LC_ALL: ja_JP.UTF-8
    HOME: /home/tester
    APPLY: ${APPLY:-0} # 0=dry-run, 1=apply
    IS_RASPI: ${IS_RASPI:-0} # 1 なら Raspberry Pi 扱いを注入する
    SOURCE_MODE: ${SOURCE_MODE:-clone} # clone=追跡ファイルのみ / mount=作業ツリー
    SKIP_INIT: ${SKIP_INIT:-0} # 1 なら init を省く (chezmoi update の経路)
    APPLY_TWICE: ${APPLY_TWICE:-0} # 1 なら apply を 2 回回して冪等性を見る
    INCLUDE_DIRTY: ${INCLUDE_DIRTY:-0} # 1 なら未コミットの変更 (追跡分) も載せる
    # chezmoi 自身が CHEZMOI_ARGS を export する (`chezmoi cd` のサブシェル等)。
    # 衝突するとテストの diff/apply に不正な引数が渡るため別名にしている。
    CHEZMOI_TEST_ARGS: ${CHEZMOI_TEST_ARGS:-}
  volumes:
    - ../:/repo:ro
  # $HOME は毎回クリーンな tmpfs にする。
  #
  # ★exec を明示する。Docker の tmpfs は既定で noexec が付き、$HOME へ入れた
  #   実行ファイルが一切起動できない。uv / mise / AI CLI はすべて $HOME 配下に
  #   入るので、これが無いと cold start は必ず失敗し、しかも
  #   「uv を導入できませんでした」のような紛らわしい形で出る
  #   (ファイルは -rwxr-xr-x で存在するのに test -x が false になる)。
  #   マウントオプションを渡せるのはこの短縮構文だけ (volumes の long 構文は
  #   size と mode しか受け付けない)。
  #
  # ★size: apply は uv / mise / 各種 CLI を実際に展開するので 100m では
  #   tar 展開の途中で溢れる。tmpfs は使った分だけメモリを消費するので
  #   上限だけ広く取る。
  tmpfs:
    - /home/tester:exec,mode=0755,size=8g
  command: ["/bin/bash", "-c", "run_chezmoi"]

x-build-args: &build-args
  USER_UID: ${USER_UID:-1000}
  USER_GID: ${USER_GID:-1000}

services:
  # 既定。最新の LTS で「壊れていないか」を最短で見る
  ubuntu2404:
    <<: *common
    build:
      context: .
      args:
        <<: *build-args
        BASE_IMAGE: ubuntu:24.04

  # 実機の Raspberry Pi と同じディストリ (22.04)。
  # system python が 3.10 なので、run_before_005_python の経路を通る
  ubuntu2204:
    <<: *common
    build:
      context: .
      args:
        <<: *build-args
        BASE_IMAGE: ubuntu:22.04

  # 実機の Raspberry Pi に最も近い (22.04 / arm64)。
  # x86 ホストでは QEMU エミュレーションになるので遅い
  raspi2204:
    <<: *common
    platform: linux/arm64
    environment:
      <<: *common-env
      IS_RASPI: ${IS_RASPI:-1} # このサービスは既定で Raspberry Pi 扱い
    build:
      context: .
      platforms:
        - linux/arm64
      args:
        <<: *build-args
        BASE_IMAGE: ubuntu:22.04

  # arm64 のバイナリ配布と依存解決だけを見たいとき (最新 LTS)
  arm2404:
    <<: *common
    platform: linux/arm64
    build:
      context: .
      platforms:
        - linux/arm64
      args:
        <<: *build-args
        BASE_IMAGE: ubuntu:24.04

  # 旧名との互換。既定サービスの別名
  chezmoi:
    <<: *common
    build:
      context: .
      args:
        <<: *build-args
        BASE_IMAGE: ubuntu:24.04
