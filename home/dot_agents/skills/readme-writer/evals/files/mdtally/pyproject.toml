[project]
name = "mdtally"
version = "0.2.0"
description = "Markdown ファイルの語数と読了時間を数える小さな CLI"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mdtally = "mdtally.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
