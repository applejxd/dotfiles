---
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.28.0
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: yamllint-local
        name: YAML Lint via uvx
        entry: mise exec -- uvx yamllint
        language: system
        files: \.(yaml|yml)$
        args: [--strict]

      # --force-exclude が無いと、pre-commit がファイル名を明示的に渡すため
      # pyproject.toml の extend-exclude (upstream 由来のコード) が無視される。
      - id: ruff-local
        name: Python Lint via uvx
        entry: mise exec -- uvx ruff@0.16.5 check --force-exclude
        language: system
        types_or: [python, pyi]

      - id: markdownlint-local
        name: Markdown Lint via mise
        entry: mise exec -- markdownlint-cli2
        language: system
        files: \.(md|markdown)$

      # SKILL.md の frontmatter が壊れても CLI は起動時に
      # "Failed to load 1 skill." としか言わないので、ここで先に弾く。
      - id: skill-frontmatter-local
        name: Skill frontmatter check
        entry: >-
          mise exec -- uv run --with pyyaml --no-project
          python scripts/agents/validate_skills.py
        language: system
        files: ^home/[^/]+/skills/[^/]+/SKILL\.md$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        name: Check YAML syntax
      - id: check-toml
        name: Check TOML syntax
        exclude: ^home/dot_codex/modify_config\.toml$
      - id: end-of-file-fixer
        name: Fix end of files
      - id: trailing-whitespace
        name: Trim trailing whitespace
