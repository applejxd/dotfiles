[project]
name = "taskboard-cli"
version = "0.4.0"
description = "ローカルの JSON ファイルでタスクを管理するコマンドラインツール"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
tb = "taskboard.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
