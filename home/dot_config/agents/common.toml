# AI CLI 統合 permission 設定 (Claude Code / Copilot CLI 両対応の単一ソース)
#
# 生成先:
#   ~/.claude/settings.json                  -> [bash] [file] [web] [claude]
#   ~/.copilot/permissions-config.json       -> [bash.allow] [copilot.locations]
#   ~/.copilot/settings.json (一部キーのみ)   -> [web] [copilot.trusted_folders]
#
# 3 層防御:
#   1. CLI UI prompt (対話モードのみ)
#   2. permission リスト (本ファイル由来、CLI のバグで bypass されることがある)
#   3. hook (check_bash.py) で hard-block ... [bash.critical_deny]
#
# Claude Code は permission リストの既知バグが複数 open (cd && bypass, git -C bypass
# 等。anthropics/claude-code#59498, #59006, #20085 ほか)。
# したがって本当に止めたい命令は [bash.critical_deny] に書き、hook で hard-block する。

# ---------------------------------------------------------------------------
# Bash 系
# ---------------------------------------------------------------------------
[bash]
# 人が書くのはこの 3 リストだけ。パターンは素のトークン列で書く
# (例: "git push")。生成/参照の流れ:
#
#   generate.py   -> ~/.claude/settings.json の permissions に Bash(<pattern>:*) を展開
#   check_bash.py -> 同じリストを読み、Claude / Copilot 双方で deny / ask を強制
#
# 2 層に配る理由: hook は設定の読み込みに失敗しうる。permission リストは
# CLI 本体が評価するので、hook が落ちても Claude 側の deny は生き残る。
# (hook 自体も設定を読めないときは fail-closed で deny する)
#
# 照合規則: normalize 後のセグメント先頭トークン一致。
# normalize は cd && X -> X, git -C foo X -> git X, compound 分割 (&&, ;, |) を実施。
# これにより作業ディレクトリを付け替えるバイパスも捕捉できる。
#
# 評価順は deny -> ask -> allow。より具体的なパターンを deny に置けば
# 一般形を ask にできる (例: "git reset --hard" は deny、"git reset" は ask)。

# 自動承認。読み取り専用・冪等なものだけ
#
# ★注意: Copilot CLI へは「先頭トークンのコマンド名」だけが渡る
#   (permissions-config.json は deny/ask 非対応)。つまり "git diff" と書くと
#   Copilot では git 全体が承認される。ask/deny 側は hook が強制するので
#   実害は無いが、allow に新しいコマンドを足すときはこの粒度差を意識すること。
#
# 作業ディレクトリを付け替える形式 (-C オプション) は allow に入れない。
# permission を回避する既知のバイパス形式 (anthropics/claude-code#59006) であり、
# 対策を用意している意図と矛盾する。
allow = [
  "git diff",
  "git status",
  "git log",
  "wc",
  "grep -n",
  "find",
  "gcc",
  "g++",
  "cmake -S",
  "cmake --build",
  "uv pip list",
  "uv sync",
  "docker ps",
  "mise run",
  # gh の読み取り系 (github-issue skill が使う)
  "gh auth status",
  "gh pr list",
  "gh pr view",
  "gh issue list",
  "gh issue view",
  "gh repo view",
  "gh run list",
  "gh run view",
  "gh project list",
  "gh project view",
  "gh project field-list",
  "gh project item-list",
]

# 提案 -> ユーザーが承認 -> そのまま実行。
# 「危険だが承認すれば妥当」なもの。取り返しがつく変更はここに置く。
#
# 無人実行では安全側に倒れる (Claude dontAsk は自動拒否、-p はスキップ、
# Copilot cloud agent は deny 扱い) ので、緩めても無人時のリスクは増えない。
ask = [
  # 削除は承認制。壊滅的なターゲット (ルートやホーム) は check_rm_root_guard が deny
  "rm",
  # 未追跡ファイルを消すので git でも復旧できない
  "git clean",
  "git branch -D",
  "git commit",
  # --hard は deny。素の reset は index を戻すだけで作業ツリーを壊さない
  "git reset",
  "uv add",
  "npm install",
  "npm ci",
  # プロジェクト内の変更で lockfile と git から復旧できる
  "npm uninstall",
  "npm remove",
  "mv",
  "python -c",
  # 取得系。センシティブファイルの送信は check_curl_file_send が hard-deny する
  "curl",
  "wget",
  # コンテナ/イメージは再作成・再 pull できる
  "docker exec",
  "docker rm",
  "docker rmi",
  # リモートに書き込むが取り消せる gh 操作
  "gh pr create",
  "gh pr checkout",
  "gh issue create",
  "gh issue close",
  "gh issue comment",
  "gh repo clone",
  # Projects v2 の mutation を含む
  "gh api graphql",
]

# 承認の余地なく拒否。
# 判断基準: 外部に出る / システムを変える / 取り返しがつかない / 規約違反。
deny = [
  "sudo",
  # リモートに公開されるものは手動操作に委ねる
  "git push",
  "git reset --hard",
  "git rebase",
  # core.hooksPath の書き換えで hook 自体を無効化できる
  "git config",
  # 外部への通信・横展開の経路
  "nc",
  "telnet",
  "ssh",
  # システム全体を汚す
  "npm install -g",
  # pip は全面禁止 (uv / uvx を使う)。hook の check_pip_redirect が
  # プロジェクト種別を問わず代替案付きで hard-deny する
  "pip",
  "pip3",
  # DB クライアント。mongod はサーバのデーモン、クライアントは mongosh
  "psql",
  "mysql",
  "mongod",
  "mongosh",
  "redis-cli",
  # -a --volumes はデータボリュームまで消す
  "docker system prune",
  # リモートに影響する gh 操作 (push と同じ基準)
  "gh pr merge",
  "gh release create",
  "gh repo delete",
]

[file]
read_allow = [
  "README.md",
  "pyproject.toml",
]

# Claude のみ反映: Read(...) を ask に追加
read_ask_globs = [
  ".env.*",
]

# Claude のみ反映: Edit(...) を ask に追加
# (書き込み系 permission rule は Edit(path) に統一。Write(path) は v2.1.210 で deprecated)
write_ask_globs = [
  ".env.*",
  "mise.toml",
]

# Claude: Read(...) deny に展開。hook の critical_deny には反映しない
# (ファイルアクセスの hook は別途必要なら作る)
#
# ★ `**/*key*` や `**/*token*` のような部分一致 glob は使わない。
#   このリポジトリだけでも keyhac.bat / key_bindings.org / keymap_layer.drawio
#   のような正当なファイルを巻き込み、エージェントが編集できなくなる
#   (一般的には tokenizer.py / keyword.py / monkey.py なども誤検知する)。
#   拡張子・接尾辞・既知のファイル名で具体的に指定する。
read_deny_globs = [
  "**/.ssh/**",
  "**/.gnupg/**",
  "**/.aws/credentials",
  "**/.netrc",
  "**/.npmrc",
  "**/.pypirc",
  "**/id_rsa*",
  "**/id_ed25519*",
  "**/id_ecdsa*",
  "**/id_dsa*",
  "**/*.pem",
  "**/*.key",
  "**/*.p12",
  "**/*.pfx",
  "**/*.jks",
  "**/*.keystore",
  "**/key.txt",
  "**/*_key",
  "**/*.token",
  "**/*_token",
  "**/token.json",
  "**/service-account*.json",
  "**/secrets/**",
  "**/*secret*",
  "**/*credential*",
  "**/*password*",
  ".env",
  "~/.copilot/settings.json",
  "~/.copilot/config.json",
]

# Claude のみ反映: Edit(...) を deny に追加
# read_deny_globs と同じ理由で部分一致 glob は使わない
write_deny_globs = [
  "**/.ssh/**",
  "**/.gnupg/**",
  "**/.aws/credentials",
  "**/.netrc",
  "**/.npmrc",
  "**/.pypirc",
  "**/id_rsa*",
  "**/id_ed25519*",
  "**/id_ecdsa*",
  "**/id_dsa*",
  "**/*.pem",
  "**/*.key",
  "**/*.p12",
  "**/*.pfx",
  "**/*.jks",
  "**/*.keystore",
  "**/key.txt",
  "**/*_key",
  "**/*.token",
  "**/*_token",
  "**/token.json",
  "**/service-account*.json",
  "**/secrets/**",
  "**/*secret*",
  "**/*credential*",
  "**/*password*",
  ".env",
]

# ---------------------------------------------------------------------------
# Web 系
# ---------------------------------------------------------------------------
[web]
# Claude: WebFetch(domain:...) として展開
# Copilot: settings.json の allowedUrls に直接反映
allow_domains = [
  "github.com",
  "api.github.com",
  "docs.github.com",
  "raw.githubusercontent.com",
  "*.githubusercontent.com",
  "hub.docker.com",
  "docs.docker.com",
  "pypi.org",
  "docs.python.org",
  "packaging.python.org",
  "npmjs.com",
  "docs.npmjs.com",
  "registry.npmjs.org",
  "chezmoi.io",
  "www.chezmoi.io",
  "mise.jdx.dev",
  "docs.astral.sh",
  "docs.anthropic.com",
  "docs.claude.com",
  "modelcontextprotocol.io",
  "arxiv.org",
  "alphaxiv.org",
  "stackoverflow.com",
  "dev.to",
  "qiita.com",
  "zenn.dev",
  "pre-commit.com",
]

# Copilot のみ (Claude は対応キーなし)
deny_domains = []

# ---------------------------------------------------------------------------
# Claude 固有
# ---------------------------------------------------------------------------
[claude]
mcp_deny = [
  "mcp__supabase__execute_sql",
]

# ---------------------------------------------------------------------------
# Copilot 固有
# ---------------------------------------------------------------------------
[copilot]
# settings.json の trustedFolders へ反映
trusted_folders = [
  "~/.local/share/chezmoi",
  "~/sandbox",
  "~/src/my-agent-core",
  "~/src/apple-agent-core",
]

# permissions-config.json の locations へ反映
# 各 location の approvals に bash.allow 由来の commands も自動追加される
[[copilot.locations]]
path = "~/.local/share/chezmoi"
approvals = [
  { kind = "write" },
]

# ---------------------------------------------------------------------------
# Hooks (Claude Code / Copilot CLI 共通の単一ソース)
# ---------------------------------------------------------------------------
# 生成先:
#   ~/.claude/settings.json の hooks 節      <- claude_event / claude_matcher
#   ~/.copilot/hooks/from-claude.json        <- copilot_event / copilot_matcher
#
# フィールド:
#   id            識別子 (生成物には出ない。テスト・レビュー用)
#   script        ~/.claude/hooks/ 配下のファイル名 (両 CLI とも同じ実体を共有)
#   runner        起動コマンド ("python3" / "bash")
#                 素の Ubuntu には `python` が無い (python3 のみ) ので python3 を使う
#   purpose       用途メモ
#   *_event       hook イベント名。空文字にするとその CLI には出力しない
#   *_matcher     matcher。省略すると matcher キー自体を出力しない (= 全ツール)
#   timeout_sec   タイムアウト秒。Claude の timeout / Copilot の timeoutSec へ反映
#                 (Claude の command hook は未指定だと 600 秒と長いので明示する)
#
# matcher の書き分け (両 CLI で意味論が違うので共通化しない):
#   Claude Code : tool 名の完全一致を `|` で OR 連結。PascalCase のみ
#   Copilot CLI : `^(?:pattern)$` として anchored される。明示的に ^...$ を書く
#                 PascalCase 名も Claude 互換モードで照合されるため両方列挙する

[[hooks]]
id = "check_bash"
script = "check_bash.py"
runner = "python3"
purpose = "bash.critical_deny を hard-block する 3 層防御の最終防波堤"
claude_event = "PreToolUse"
claude_matcher = "Bash"
copilot_event = "PreToolUse"
copilot_matcher = "^(Bash|bash)$"
timeout_sec = 30

[[hooks]]
id = "redirect-tmp"
script = "redirect-tmp.py"
runner = "python3"
purpose = "/tmp 利用を検出して ./.tmp へ誘導する"
# スクリプトが処理する kind は bash / view / create / edit の 4 つだけなので
# matcher もそれに合わせる (無駄な hook 起動を避ける)
claude_matcher = "Bash|Read|Write|Edit"
claude_event = "PreToolUse"
copilot_event = "PreToolUse"
copilot_matcher = "^(Bash|bash|Read|view|Write|create|Edit|edit)$"
timeout_sec = 30

[[hooks]]
id = "markdownlint"
script = "markdownlint.sh"
runner = "bash"
purpose = "Markdown 編集後に markdownlint --fix と残存違反の警告"
claude_event = "PostToolUse"
claude_matcher = "Edit|Write"
copilot_event = "PostToolUse"
copilot_matcher = "^(Edit|Write|edit|create)$"
timeout_sec = 30

[[hooks]]
id = "format-file"
script = "format-file.sh"
runner = "bash"
purpose = "編集したファイルを拡張子に応じて整形 (ruff / clang-format / prettier)"
claude_event = "PostToolUse"
claude_matcher = "Edit|Write"
copilot_event = "PostToolUse"
copilot_matcher = "^(Edit|Write|edit|create)$"
timeout_sec = 30

[[hooks]]
id = "update-adr-on-stop"
script = "update-adr-on-stop.py"
runner = "python3"
purpose = "ターン終了時に ADR 更新の要否を確認する"
claude_event = "Stop"
copilot_event = "Stop"
timeout_sec = 60
