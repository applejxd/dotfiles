[tools]
gitleaks = "8.28.0"
go = "latest"
uv = "latest"
shellcheck = "0.11.0"
# pre-commit の Markdown Lint が使う。グローバル設定に頼るとクローン直後に無い。
"npm:markdownlint-cli2" = "0.22.1"
# markdownlint-cli2 の shim は node を exec するが、`mise exec` は
# この [tools] に載ったものしか PATH へ置かない。node が無いと
# `exec: node: not found` で Markdown Lint が落ちる。
node = "latest"

[env]
UV_PROJECT_ENVIRONMENT = "{% if os() == 'windows' %}.venv-windows{% else %}.venv{% endif %}"

[tasks.e2e]
description = "Docker で cold start を検証する（引数: [service] [mode]。test/README.md 参照）"
run = "bash test/test.sh"

[tasks.verify]
description = "変更に応じた検証だけを選んで実行する（日常用。横断的な変更は全件へフォールバック）"
run = "python3 scripts/verify.py --changed"

[tasks."verify:all"]
description = "検証を全件実行する（安い検査を先に回し、前の段が落ちたら止まる。コミット前に 1 回）"
run = "python3 scripts/verify.py --all"

[tasks."models:check"]
description = "子エージェントのモデルのカタログを pi --list-models と比べる（一覧に無い項目・新しい世代・reviewed_on を警告。一覧の取得失敗は終了コード 2）"
run = "python3 scripts/models.py check"

[tasks."models:probe"]
description = "カタログのモデルを、短い応答とツール呼び出しで確かめる（既定は未確認のもの。--model / --effort / --all / --dry-run。verified は手で直す）"
run = "python3 scripts/models.py probe"

[tasks."tmp:clean"]
description = "作業ツリーの .tmp/ を掃除する（既定は一覧だけ。引数: --apply で消す、--all で未知の名前も）"
run = "python3 home/dot_config/pi/harness/tmp_clean.py"

[tasks."opencode:probe"]
description = "隔離環境で opencode を実行する（実 DB を汚さない）"
run = "./scripts/opencode_probe.sh"

[tasks."websearch:keys"]
description = "web-search の API キーを Bitwarden から取り直す（BW_SESSION が無ければ bw unlock を求める）"
run = "uv run --no-project {{ get_env(name='USERPROFILE', default=env.HOME) }}/.claude/skills/web-search/scripts/websearch.py sync-keys --force --unlock"

[tasks.dotfiles-update]
description = "Update zinit itself and all zinit-managed plugins (run after `chezmoi update` on other PCs)"
run = [
  "zsh -ic 'zinit self-update && zinit update --all'",
  # zeno のモジュールキャッシュを明示更新
  # (ZENO_DISABLE_EXECUTE_CACHE_COMMAND=1 にしているため起動時の自動キャッシュは行わないので、
  #  ここで一括して deno cache を最新化する)
  "if [ -f \"${HOME}/.zinit/plugins/yuki-yano---zeno.zsh/src/cli.ts\" ]; then deno cache --node-modules-dir=auto --no-lock --no-check -- \"${HOME}/.zinit/plugins/yuki-yano---zeno.zsh/src/cli.ts\" || true; fi",
  # zinit completions ディレクトリには各プラグイン配下の補完ファイルへのシンボリックリンクが集約されるが、
  # upstream が補完ファイルを削除するとリンクが宙ぶらりんになり compinit が警告を出す。更新後にまとめて掃除する。
  "find \"${HOME}/.zinit/completions\" -xtype l -delete",
]

[tasks.clear-resurrect]
description = "Clear zsh-resurrect cache"
run = "rm -rf ~/.local/share/tmux/resurrect"
