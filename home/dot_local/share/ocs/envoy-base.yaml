# 仕組みは docs/change/0037-pis-usability-and-telemetry.md の「認証の方針」。
node: {id: pis-broker, cluster: pis-broker}
static_resources:
  listeners:
    # @LISTENERS@
  clusters:
    # @CLUSTERS@
