# yamllint disable rule:indentation
# (断片。envoy-base.yaml の中へ差し込むので、行頭がインデントされている)
# pis の Copilot ブローカー (設定 [pis.broker] copilot = "auto") の Envoy の断片 (リスナーとクラスタ)。
# broker.py が起動ごとに、アットマークで囲んだ次の 4 つの名前を置き換えて、envoy-base.yaml へ差し込む。
#   PORT     127.0.0.1 のリッスンポート (空きポート。引用符ごと整数に置き換える)
#   HOST     中継先 (Copilot の API ホスト。トークンの proxy-ep から決める)
#   SDS_DIR  SDS ファイル copilot-sds.json を置く状態ディレクトリの絶対パス
#   CA_FILE  上流の証明書を検証する CA バンドルの絶対パス (無ければ broker.py が起動を拒否する)
# 前半がリスナーの項目、後半 (区切りの行の後) がクラスタの項目。区切りの行を消さない。
    - name: copilot
      address:
        socket_address: {address: 127.0.0.1, port_value: "@PORT@"}
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: copilot
                normalize_path: true
                merge_slashes: true
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        text_format_source:
                          inline_string: "ACCESS %REQ(:METHOD)% %REQ(:PATH)% %RESPONSE_CODE%\n"
                stream_idle_timeout: 3600s
                route_config:
                  name: copilot
                  virtual_hosts:
                    - name: copilot
                      domains: ["*"]
                      routes:
                        # pis が起動前に身元を確かめる (上流へは出さない)
                        - match: {path: "/__pis_broker"}
                          direct_response:
                            status: 200
                            body: {inline_string: "pis-broker-copilot"}
                        # 内側から送れる要求は、観測した 3 つの POST だけ (CHG-0037)。それ以外は 403
                        - match: {path: "/v1/messages", headers: [{name: ":method", string_match: {exact: POST}}]}
                          route: &upstream
                            cluster: copilot_upstream
                            timeout: 0s
                            idle_timeout: 3600s
                            host_rewrite_literal: "@HOST@"
                        - match: {path: "/responses", headers: [{name: ":method", string_match: {exact: POST}}]}
                          route: *upstream
                        - match: {path: "/chat/completions", headers: [{name: ":method", string_match: {exact: POST}}]}
                          route: *upstream
                        - match: {prefix: "/"}
                          direct_response:
                            status: 403
                            body: {inline_string: "pis-broker: path or method not allowed"}
                http_filters:
                  - name: envoy.filters.http.credential_injector
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.credential_injector.v3.CredentialInjector
                      overwrite: true
                      credential:
                        name: envoy.http.injected_credentials.generic
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.http.injected_credentials.generic.v3.Generic
                          header: Authorization
                          header_value_prefix: "Bearer "
                          credential:
                            name: copilot_token
                            sds_config:
                              path_config_source:
                                path: "@SDS_DIR@/copilot-sds.json"
                                watched_directory: {path: "@SDS_DIR@"}
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
# ---clusters---
    - name: copilot_upstream
      type: LOGICAL_DNS
      dns_lookup_family: V4_ONLY
      load_assignment:
        cluster_name: copilot_upstream
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: {address: "@HOST@", port_value: 443}
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          sni: "@HOST@"
          common_tls_context:
            validation_context:
              trusted_ca: {filename: "@CA_FILE@"}
              match_typed_subject_alt_names: [{san_type: DNS, matcher: {suffix: "githubcopilot.com"}}]
