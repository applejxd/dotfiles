[project]
name = "dotfiles"
version = "0.1.0"
description = "Dotfiles for personal configuration"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "keypirinha-stub",
    "pre-commit>=4.3.0",
    "yamllint>=1.35.1",
]

[tool.uv.sources]
keypirinha-stub = { git = "https://github.com/applejxd/keypirinha-stub.git" }

[tool.ruff]
# upstream 由来のコードは対象外にする。
# home/AppData は Keyhac / Keypirinha の同梱物、
# home/dot_config/gdb は Eigen / OpenCV 付属の pretty printer。
# modify_json.py.tmpl は Go テンプレート展開後に Python として実行する。
extend-exclude = [
  "home/AppData",
  "home/.chezmoitemplates/modify_json.py.tmpl",
  "home/dot_config/gdb",
  # 計測の課題 (作業役が読む) と隠しテスト。直すと前の計測と条件が変わる
  "scripts/model-eval/worker/base",
  "scripts/model-eval/worker/hidden",
]
# 既存コードの実測に合わせる (最長 109 桁、100 桁超は 7 行だけ)。
# 既定の 88 桁にすると 74 行の折り返しが必要になり、変更が本題からずれる。
line-length = 100

[tool.ruff.lint]
# ruff の既定ルールはバージョンで変わるので明示する。
# S (bandit) と BLE は選ばない。hook は「設定を読めなければ fail-closed で
# deny する」ために意図的な広い except と subprocess 実行を持つため。
# PERF も選ばない。permission リストの組み立ては「設定キー -> 権限の形」の
# 対応を並列構造で見せる意図があり、要素数も数十なので内包表記に畳む利得が無い。
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PIE", "RUF"]
# RUF001-003 は全角括弧などを「紛らわしい文字」として弾く。
# このリポジトリはコメント・メッセージを日本語で書くので意図した文字。
# SIM108 (三項演算子) は、長い式や日本語の文言を含む代入で、かえって読みにくくなる。
ignore = ["RUF001", "RUF002", "RUF003", "SIM108"]

[tool.ruff.lint.pycodestyle]
# E501 の上限だけを広げる (line-length は整形の幅として 100 のまま)。ruff は全角を幅 2 で数えるので、
# 日本語のコメント・docstring は 100 桁だと 50 文字ぶんしか書けない。実測の最長は 139。
max-line-length = 140

[tool.ruff.lint.per-file-ignores]
# pytest の fixture を別ファイルから import して使う (引数名が再定義に見える)
"test/agents/test_pi_harness_extensions.py" = ["F811"]
