# AI CLI 統合 permission 設定 (Claude Code / Copilot CLI 両対応の単一ソース)
#
# 生成先:
#   ~/.claude/settings.json                  -> [bash] [file] [web] [claude]
#   ~/.copilot/permissions-config.json       -> [bash.allow] [copilot.locations]
#   ~/.copilot/settings.json (一部キーのみ)   -> [web] [copilot.trusted_folders]
#
# 2 層構成:
#   1. permission リスト (本ファイル由来。Claude のみ。CLI 本体が評価する)
#   2. hook (check_bash.py) が同じリストを読んで deny / ask を強制 (Claude + Copilot)
#
# Claude Code は permission リストの既知バグが複数 open (cd && bypass, git -C bypass
# 等。anthropics/claude-code#59498, #59006, #20085 ほか)。
# hook 側は normalize してから照合するので、これらのバイパスも捕捉できる。
# 逆に hook は設定を読めないと機能しないため、permission リストを併用して
# 多層にしている (hook 自体も設定を読めないときは fail-closed で deny する)。

# ---------------------------------------------------------------------------
# Bash 系
# ---------------------------------------------------------------------------
[bash]
# 人が書くのはこの 3 リストだけ。パターンは素のトークン列で書く
# (例: "git push")。生成/参照の流れ:
#
#   generate.py   -> ~/.claude/settings.json の permissions に Bash(<pattern>:*) を展開
#   check_bash.py -> 同じリストを読み、Claude / Copilot 双方で deny / ask を強制
#
# 2 層に配る理由: hook は設定の読み込みに失敗しうる。permission リストは
# CLI 本体が評価するので、hook が落ちても Claude 側の deny は生き残る。
# (hook 自体も設定を読めないときは fail-closed で deny する)
#
# 照合規則: normalize 後のセグメント先頭トークン一致。
# normalize は cd && X -> X, git -C foo X -> git X, compound 分割 (&&, ;, |) を実施。
# これにより作業ディレクトリを付け替えるバイパスも捕捉できる。
#
# 評価順は deny -> ask -> allow。より具体的なパターンを deny に置けば
# 一般形を ask にできる (例: "git reset --hard" は deny、"git reset" は ask)。

# 自動承認。読み取り専用・冪等なものだけ
#
# ★注意: Copilot CLI へは「先頭トークンのコマンド名」だけが渡る
#   (permissions-config.json は deny/ask 非対応)。つまり "git diff" と書くと
#   Copilot では git 全体が承認される。ask/deny 側は hook が強制するので
#   実害は無いが、allow に新しいコマンドを足すときはこの粒度差を意識すること。
#
# 作業ディレクトリを付け替える形式 (-C オプション) は allow に入れない。
# permission を回避する既知のバイパス形式 (anthropics/claude-code#59006) であり、
# 対策を用意している意図と矛盾する。
allow = [
  "git diff",
  "git status",
  "git log",
  "wc",
  "grep -n",
  "find",
  "gcc",
  "g++",
  "cmake -S",
  "cmake --build",
  "uv pip list",
  "uv sync",
  "docker ps",
  "mise run",
  # gh は Copilot 側で先頭トークンまで粗粒度化されるため allow に置かない。
  # 読み取り系は未掲載にして auto / assisted へ委譲し、mutation は ask / deny
  # または check_bash.py の gh api 意味解析で止める。
]

# 提案 -> ユーザーが承認 -> そのまま実行。
# 「危険だが承認すれば妥当」なもの。取り返しがつく変更はここに置く。
#
# ★ ask に載せると、両 CLI の LLM 判定モードに到達しない。
#   Claude Code は「permissions.ask に一致するツールはどのモードでも
#   自動承認されない」と明記され、hook の ask もプロンプトを最低保証する。
#   Copilot CLI の assisted も同様に止まる。
#   → LLM の判断に委ねたいコマンドは、allow ではなく「どのリストにも
#     載せない (未掲載)」にする。allow に入れると手動モードでも無条件に
#     通ってしまい、かえって緩くなる。
#
#   未掲載にしても hook の個別 deny チェックは効く。
#   (check_interpreter_inline_code / check_pipe_to_shell /
#    check_curl_file_send / check_reverse_shell など)
#
# ask に残す基準:
#   1. 不可逆か            — 復旧できない削除・履歴の書き換え
#   2. 外部に見えるか      — リモートへの書き込み、外部との通信
#   3. 秘密や防御に触るか  — 認証情報、hook や permission の設定
#
# 逆に「引数を見れば妥当性が判断できる」「hook が危険な形を個別に捕捉できる」
# ものは未掲載にして LLM 判定に委ねる (uvx / npx / python -c / npm install 等)。
#
# 無人実行では安全側に倒れる (Claude dontAsk は自動拒否、-p はスキップ、
# Copilot cloud agent は deny 扱い) ので、緩めても無人時のリスクは増えない。
ask = [
  # 削除は承認制。壊滅的なターゲット (ルートやホーム) は check_rm_root_guard が deny
  "rm",
  # 未追跡ファイルを消すので git でも復旧できない
  "git clean",
  "git branch -D",
  "git commit",
  # --hard は deny。素の reset は index を戻すだけで作業ツリーを壊さない
  "git reset",
  # 取得系。センシティブファイルの送信は check_curl_file_send が hard-deny する
  "curl",
  "wget",
  # コンテナ/イメージは再作成・再 pull できるが状態を失う
  "docker rm",
  "docker rmi",
  # リモートに書き込むが取り消せる gh 操作
  "gh pr create",
  "gh pr checkout",
  "gh issue create",
  "gh issue close",
  "gh issue comment",
  # gh api は check_bash.py が REST method / GraphQL operation を解析する。
  # GET / HEAD / query は未掲載、mutation と判定不能形式だけ ask にする。
  # グローバルに常駐する (pipx run は未掲載で LLM 判定に委ねる)
  "pipx install",
  # 素の疎通確認 (-z など) は使うが、-e/-c/-l は check_reverse_shell が deny する
  "nc",
  # 読み取り (--get / --list) も含めて確認を挟む。hook を無効化しうる
  # 書き込み (--global / core.hooksPath 等) は deny 側
  "git config",
]
# 承認の余地なく拒否。
# 判断基準: 外部に出る / システムを変える / 取り返しがつかない / 規約違反。
deny = [
  "sudo",
  # リモートに公開されるものは手動操作に委ねる
  "git push",
  "git reset --hard",
  "git rebase",
  # core.hooksPath の書き換えで hook 自体を無効化できる。
  # 読み取り (--get / --list) は allow 側にあるので通る
  "git config --global",
  "git config --system",
  "git config --local",
  "git config core.hooksPath",
  "git config --unset",
  "git config --add",
  "git config --replace-all",
  "git config --edit",
  # 履歴・参照を書き換える / 作業内容を失わせる操作
  "git filter-branch",
  "git update-ref -d",
  "git reflog expire",
  "git stash clear",
  "git stash drop",
  "git worktree remove",
  # 追跡ファイルの変更を破棄する (git でも復旧できない)
  "git checkout --",
  "git restore",
  # スケジュール実行で監視外に逃がす
  "crontab",
  "at",
  "batch",
  # サービスの状態を変える (status / show などの読み取りは許可)
  "systemctl enable",
  "systemctl disable",
  "systemctl mask",
  "systemctl start",
  "systemctl stop",
  "systemctl restart",
  "systemctl daemon-reload",
  "systemd-run",
  # ディスク・デバイスの破壊
  "mkfs",
  "mkfs.ext4",
  "mkfs.xfs",
  "fdisk",
  "parted",
  "wipefs",
  # 待ち受け・トンネル (外部からの侵入経路)
  "socat",
  "ncat",
  # 外部への通信・横展開の経路
  "telnet",
  "ssh",
  # システム全体を汚す
  "npm install -g",
  # pip は全面禁止 (uv / uvx を使う)。hook の check_pip_redirect が
  # プロジェクト種別を問わず代替案付きで hard-deny する
  "pip",
  "pip3",
  # DB クライアント。mongod はサーバのデーモン、クライアントは mongosh
  "psql",
  "mysql",
  "mongod",
  "mongosh",
  "redis-cli",
  # -a --volumes はデータボリュームまで消す
  "docker system prune",
  "docker volume prune",
  "docker image prune",
  "docker container prune",
  "docker network prune",
  # キャッシュ削除は再取得に時間がかかる
  "npm cache clean",
  "yarn cache clean",
  "pnpm store prune",
  # リモートに影響する gh 操作 (push と同じ基準)
  "gh pr merge",
  "gh release create",
  "gh repo delete",
  # ローカルの内容を外部へ出す経路 (git push を deny にしているのと同じ基準)
  "gh gist create",
  "gh secret set",
  "gh secret list",
  # トークンを直接引く操作 (gh api graphql は Projects v2 で使うので ask 側)
  "gh auth token",
  # 秘密情報ストアからの読み出し (Bitwarden / 1Password / Vault)
  "bw get",
  "bw list",
  "bw export",
  "op read",
  "op item get",
  "vault read",
  "vault kv get",
  "chezmoi secret",
  # リモート先を差し替えると push 先が変わる
  "git remote add",
  "git remote set-url",
  "scp",
  "rsync",
  "sftp",
  # クラウドストレージへの転送
  "aws s3 cp",
  "aws s3 sync",
  "gsutil cp",
  "az storage blob upload",
  "gh release upload",
]

[file]
read_allow = [
  "README.md",
  "pyproject.toml",
]

# Claude のみ反映: Read(...) を ask に追加
read_ask_globs = [
  ".env.*",
]

# Claude のみ反映: Edit(...) を ask に追加
# (書き込み系 permission rule は Edit(path) に統一。Write(path) は v2.1.210 で deprecated)
write_ask_globs = [
  ".env.*",
  "mise.toml",
]

# Claude: Read(...) deny に展開。hook の bash ポリシーには反映しない
# (ファイルアクセスの hook は別途必要なら作る)
#
# ★ `**/*key*` や `**/*token*` のような部分一致 glob は使わない。
#   このリポジトリだけでも keyhac.bat / key_bindings.org / keymap_layer.drawio
#   のような正当なファイルを巻き込み、エージェントが編集できなくなる
#   (一般的には tokenizer.py / keyword.py / monkey.py なども誤検知する)。
#   拡張子・接尾辞・既知のファイル名で具体的に指定する。
read_deny_globs = [
  "**/.ssh/**",
  "**/.gnupg/**",
  "**/sops/age/**",
  "**/.aws/credentials",
  "**/.netrc",
  "**/.npmrc",
  "**/.pypirc",
  "**/id_rsa*",
  "**/id_ed25519*",
  "**/id_ecdsa*",
  "**/id_dsa*",
  "**/*.pem",
  "**/*.key",
  "**/*.p12",
  "**/*.pfx",
  "**/*.jks",
  "**/*.keystore",
  "**/key.txt",
  "**/keys.txt",
  "**/*_key",
  "**/*.token",
  "**/*_token",
  "**/token.json",
  "**/service-account*.json",
  "**/secrets/**",
  "**/*secret*",
  "**/*credential*",
  "**/*password*",
  ".env",
  "~/.copilot/settings.json",
  "~/.copilot/config.json",
]

# Claude のみ反映: Edit(...) を deny に追加
# read_deny_globs と同じ理由で部分一致 glob は使わない
write_deny_globs = [
  "**/.ssh/**",
  "**/.gnupg/**",
  "**/sops/age/**",
  "**/.aws/credentials",
  "**/.netrc",
  "**/.npmrc",
  "**/.pypirc",
  "**/id_rsa*",
  "**/id_ed25519*",
  "**/id_ecdsa*",
  "**/id_dsa*",
  "**/*.pem",
  "**/*.key",
  "**/*.p12",
  "**/*.pfx",
  "**/*.jks",
  "**/*.keystore",
  "**/key.txt",
  "**/keys.txt",
  "**/*_key",
  "**/*.token",
  "**/*_token",
  "**/token.json",
  "**/service-account*.json",
  "**/secrets/**",
  "**/*secret*",
  "**/*credential*",
  "**/*password*",
  ".env",
]

# ---------------------------------------------------------------------------
# Web 系
# ---------------------------------------------------------------------------
[web]
# Claude: WebFetch(domain:...) として展開
# Copilot: settings.json の allowedUrls に直接反映
allow_domains = [
  "github.com",
  "api.github.com",
  "docs.github.com",
  "raw.githubusercontent.com",
  "*.githubusercontent.com",
  "hub.docker.com",
  "docs.docker.com",
  "pypi.org",
  "docs.python.org",
  "packaging.python.org",
  "npmjs.com",
  "docs.npmjs.com",
  "registry.npmjs.org",
  "chezmoi.io",
  "www.chezmoi.io",
  "mise.jdx.dev",
  "docs.astral.sh",
  "docs.anthropic.com",
  "docs.claude.com",
  "modelcontextprotocol.io",
  "arxiv.org",
  "alphaxiv.org",
  "stackoverflow.com",
  "dev.to",
  "qiita.com",
  "zenn.dev",
  "pre-commit.com",
]

# Copilot のみ (Claude は対応キーなし)
deny_domains = []

# ---------------------------------------------------------------------------
# Claude 固有
# ---------------------------------------------------------------------------
[claude]
# 新規セッションの権限モード (~/.claude/settings.json の permissions.defaultMode)
#   "default" (= manual): 読み取り以外は都度プロンプト
#   "acceptEdits"       : 読み取り + ファイル編集 + 一般的な filesystem コマンド
#   "auto"              : classifier (別モデル) が審査して自動承認する
#   "dontAsk"           : 事前承認済みのツールのみ (CI 向け)
#   "bypassPermissions" : 全て素通り (隔離環境専用)
# ask / deny リストと hook はどのモードでも効くので、auto でも防御は残る。
# 出典: https://code.claude.com/docs/en/permission-modes
default_permission_mode = "auto"

mcp_deny = [
  "mcp__supabase__execute_sql",
]

# ---------------------------------------------------------------------------
# Copilot 固有
# ---------------------------------------------------------------------------
[copilot]
# 新規対話セッションの権限モード (~/.copilot/settings.json)
#   "manual" (既定): write / command は都度プロンプト。read-only は自動承認
#   "assisted"     : LLM の safety check が安全と判断した要求を自動承認し、
#                    それ以外はプロンプト。experimental な auto-approval が必要
#   "allow-all"    : 全て自動承認 (--allow-all 相当)
# 再開セッション・非対話実行・--allow-all 済みセッションでは無視される。
# 出典: `copilot help config` (ローカル CLI が権威ある一覧を持つ)
default_permission_mode = "assisted"
# assisted は experimental な auto-approval 機能に依存する
experimental = true

# settings.json の trustedFolders へ反映
trusted_folders = [
  "~/.local/share/chezmoi",
  "~/sandbox",
  "~/src/my-agent-core",
  "~/src/apple-agent-core",
]

# permissions-config.json の locations へ反映
# 各 location の approvals に bash.allow 由来の commands も自動追加される
[[copilot.locations]]
path = "~/.local/share/chezmoi"
approvals = [
  { kind = "write" },
]

# ---------------------------------------------------------------------------
# Hooks (Claude Code / Copilot CLI 共通の単一ソース)
# ---------------------------------------------------------------------------
# 生成先:
#   ~/.claude/settings.json の hooks 節      <- claude_event / claude_matcher
#   ~/.copilot/hooks/from-claude.json        <- copilot_event / copilot_matcher
#
# フィールド:
#   id            識別子 (生成物には出ない。テスト・レビュー用)
#   script        ~/.claude/hooks/ 配下のファイル名 (両 CLI とも同じ実体を共有)
#   runner        起動コマンド ("python3" / "bash")
#                 素の Ubuntu には `python` が無い (python3 のみ) ので python3 を使う
#   purpose       用途メモ
#   *_event       hook イベント名。空文字にするとその CLI には出力しない
#   *_matcher     matcher。省略すると matcher キー自体を出力しない (= 全ツール)
#   timeout_sec   タイムアウト秒。Claude の timeout / Copilot の timeoutSec へ反映
#                 (Claude の command hook は未指定だと 600 秒と長いので明示する)
#
# matcher の書き分け (両 CLI で意味論が違うので共通化しない):
#   Claude Code : tool 名の完全一致を `|` で OR 連結。PascalCase のみ
#   Copilot CLI : `^(?:pattern)$` として anchored される。明示的に ^...$ を書く
#                 PascalCase 名も Claude 互換モードで照合されるため両方列挙する

[[hooks]]
id = "check_bash"
script = "check_bash.py"
runner = "python3"
purpose = "[bash] deny / ask を両 CLI で強制する (permission リストの補完)"
claude_event = "PreToolUse"
claude_matcher = "Bash"
copilot_event = "PreToolUse"
copilot_matcher = "^(Bash|bash)$"
timeout_sec = 30

[[hooks]]
id = "redirect-tmp"
script = "redirect-tmp.py"
runner = "python3"
purpose = "/tmp への書き込みを検出して ./.tmp へ誘導する (読み取り専用操作は許可)"
# スクリプトが処理する kind は bash / create / edit の 3 つだけなので matcher
# もそれに合わせる (無駄な hook 起動を避ける)。view (Read) は常に許可なので
# hook を呼ぶ必要が無く、matcher から除外している。
claude_matcher = "Bash|Write|Edit"
claude_event = "PreToolUse"
copilot_event = "PreToolUse"
copilot_matcher = "^(Bash|bash|Write|create|Edit|edit)$"
timeout_sec = 30

[[hooks]]
id = "markdownlint"
script = "markdownlint.sh"
runner = "bash"
purpose = "Markdown 編集後に markdownlint --fix と残存違反の警告"
claude_event = "PostToolUse"
claude_matcher = "Edit|Write"
copilot_event = "PostToolUse"
copilot_matcher = "^(Edit|Write|edit|create)$"
timeout_sec = 30

[[hooks]]
id = "format-file"
script = "format-file.sh"
runner = "bash"
purpose = "編集したファイルを拡張子に応じて整形 (ruff / clang-format / prettier)"
claude_event = "PostToolUse"
claude_matcher = "Edit|Write"
copilot_event = "PostToolUse"
copilot_matcher = "^(Edit|Write|edit|create)$"
timeout_sec = 30

[[hooks]]
id = "update-adr-on-stop"
script = "update-adr-on-stop.py"
runner = "python3"
purpose = "ターン終了時に ADR 更新の要否を確認する"
claude_event = "Stop"
copilot_event = "Stop"
timeout_sec = 60
