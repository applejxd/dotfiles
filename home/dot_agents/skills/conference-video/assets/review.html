<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>conference-video 確認</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --line:#d8dce3; --ink:#1d2330; --sub:#5b6577;
          --ok:#1a7f4b; --warn:#b26a00; --bad:#c0392b; --acc:#2456d6; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.6 system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;
         background:var(--bg); color:var(--ink); }
  header { background:var(--card); border-bottom:1px solid var(--line); padding:10px 20px;
           position:sticky; top:0; z-index:5; }
  header h1 { font-size:16px; margin:0 0 2px; }
  .path { color:var(--sub); font-size:12px; word-break:break-all; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
  .chip { border:1px solid var(--line); border-radius:999px; padding:2px 12px; cursor:pointer;
          background:#fff; font-size:13px; }
  .chip.active { border-color:var(--acc); box-shadow:0 0 0 1px var(--acc); }
  .chip .st { font-weight:600; margin-left:6px; }
  .st.ok { color:var(--ok); } .st.warn { color:var(--warn); } .st.bad { color:var(--bad); }
  .st.none { color:var(--sub); }
  main { max-width:1100px; margin:16px auto; padding:0 16px 80px; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:8px;
           padding:14px 16px; margin-bottom:14px; }
  .approve { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .approve input[type=text] { flex:1; min-width:180px; }
  button { font:inherit; padding:4px 12px; border:1px solid var(--line); border-radius:6px;
           background:#fff; cursor:pointer; }
  button.primary { background:var(--ok); color:#fff; border-color:var(--ok); }
  button.danger { background:var(--bad); color:#fff; border-color:var(--bad); }
  button:disabled { opacity:.5; cursor:default; }
  input[type=text], textarea, select { font:inherit; border:1px solid var(--line);
           border-radius:6px; padding:4px 8px; background:#fff; color:inherit; }
  textarea { width:100%; resize:vertical; min-height:2.6em; }
  table { width:100%; border-collapse:collapse; }
  th, td { border-bottom:1px solid var(--line); padding:6px 6px; vertical-align:top; text-align:left; }
  td button { white-space:nowrap; }
  col.narrow { width:92px; } col.note { width:230px; } col.num { width:44px; } col.time { width:56px; }
  th { color:var(--sub); font-weight:600; font-size:12px; }
  .reading { color:var(--sub); font-size:12px; word-break:break-all; }
  .small { font-size:12px; color:var(--sub); }
  .banner { padding:8px 12px; border-radius:6px; margin-bottom:10px; background:#fff4e0;
            border:1px solid #f0c36d; }
  .banner.bad { background:#fdecea; border-color:#e8a29a; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:12px; }
  .card { border:1px solid var(--line); border-radius:8px; padding:10px; background:#fff; }
  .card img, .card video { width:100%; max-height:220px; object-fit:contain; background:#111;
           border-radius:6px; }
  .card .row { margin-top:6px; display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .player { width:100%; max-height:420px; background:#000; border-radius:8px; }
  tr.cur { background:#eef3ff; }
  tr.cand { background:#fff8e6; }
  input.stale { background:#fff3cd; border-color:#e0a800; }
  input.fixed { background:#eef2f7; color:#667; text-decoration:line-through; }
  .notecell { display:flex; gap:4px; align-items:center; flex-wrap:wrap; }
  .draft { outline:2px solid #e0a800; }
  .conflict { outline:2px solid var(--bad); }
  .saved { color:var(--ok); font-size:12px; margin-left:6px; }
  .err { color:var(--bad); font-size:12px; margin-left:6px; }
  #toast { position:fixed; left:50%; bottom:16px; transform:translateX(-50%); z-index:20;
           display:flex; flex-direction:column; gap:6px; align-items:center; }
  .toast { padding:8px 14px; border-radius:8px; color:#fff; box-shadow:0 2px 8px #0003;
           max-width:760px; }
  .toast.ok { background:var(--ok); } .toast.bad { background:var(--bad); }
  pre { white-space:pre-wrap; word-break:break-word; margin:0; }
  a { color:var(--acc); }
</style>
</head>
<body>
<header>
  <h1>conference-video 確認</h1>
  <div class="path" id="path"></div>
  <div class="chips" id="chips"></div>
</header>
<main id="main"></main>
<audio id="voice" preload="none"></audio>
<div id="toast"></div>
<script>
"use strict";
const ITEMS = [["plan","構成案"],["script","台本"],["yomi","読み"],["assets","素材"],["video","動画"]];  // タブ
const APPROVAL = ["plan", "video"];  // 承認するのは構成案と最終動画だけ(ADR-0004)。ほかは作業状態
let S = null;            // /api/state
let tab = ITEMS.some(([id]) => id === location.hash.slice(1)) ? location.hash.slice(1) : "script";

function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
}
const fileUrl = (u) => u;
async function api(path, body) {
  const r = await fetch(path, {
    method: body === undefined ? "GET" : "POST",
    headers: body === undefined ? {} : {"Content-Type": "application/json"},
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) { const err = new Error(data.error || ("HTTP " + r.status)); err.status = r.status; throw err; }
  return data;
}
async function load(keepScroll = true) {
  const y = window.scrollY;
  const rv = await api("/api/rev").catch(() => null);  // 先に取る(間に変わっていれば次の確認で拾う)
  S = await api("/api/state");
  if (rv) lastRev = rv.rev;
  render();
  if (keepScroll) window.scrollTo(0, y);
}
// 外(エージェント・別のタブ・CLI)でファイルが変わったら、画面を最新にする。
// 入力中の内容は render() が残す。非表示のタブでは確認しない。
let lastRev = null, polling = false;
async function poll() {
  if (document.hidden || polling) return;
  polling = true;
  try {
    const rv = await api("/api/rev");
    if (lastRev === null) lastRev = rv.rev;
    else if (rv.rev !== lastRev) { await load(); toast("ファイルが外で更新されたので、画面を最新にしました"); }
  } catch (e) { /* 次の確認でやり直す */ }
  finally { polling = false; }
}
setInterval(poll, 2000);
document.addEventListener("visibilitychange", poll);
function toast(msg, bad) {  // 再描画で消えないよう、画面の下に固定して出す
  const box = document.getElementById("toast");
  const s = h("div", {class: "toast " + (bad ? "bad" : "ok")}, msg);
  box.append(s); setTimeout(() => s.remove(), bad ? 9000 : 2000);
}
async function act(btn, fn, okMsg = "保存しました") {
  btn.disabled = true;
  try { const r = await fn(); toast(okMsg); await load(); return r; }
  catch (e) {
    toast(e.message, true);
    if (e.status === 409) {  // 最新の内容を見せる。入力した内容は render() が残す
      await load().catch(() => {});
      toast(keptNote || "最新の内容を読み込みました。確かめて、もう一度保存してください", false);
    }
  }
  finally { btn.disabled = false; }
}

// ── 承認の状態 ──
function approvalView(item) {
  if (!APPROVAL.includes(item)) return ["", ""];  // 台本・読み・素材は承認しない
  const a = S.approvals[item];
  if (!a) return ["未承認", "none"];
  if (a.stale) return ["古い(承認後に変更)", "warn"];
  if (a.status === "承認" && a.changed) return ["承認(承認後に変更あり)", "ok"];
  if (item === "video" && a.status === "承認" && S.release && !S.release.ok) return ["承認(公開前チェックが通らない)", "warn"];
  return a.status === "承認" ? ["承認", "ok"] : ["要修正", "bad"];
}
function renderHeader() {
  document.getElementById("path").textContent = "作業フォルダ: " + S.workdir;
  const box = document.getElementById("chips"); box.replaceChildren();
  for (const [id, label] of ITEMS) {
    const [t, cls] = approvalView(id);
    box.append(h("span", {class: "chip" + (tab === id ? " active" : ""),
      onclick: () => { tab = id; history.replaceState(null, "", "#" + id); render(); }}, label, t ? h("span", {class: "st " + cls}, t) : null));
  }
}
const humanChecked = new Set();  // 動画の承認前に、人が確かめた項目
let checkedRev = null;           // 確かめた対象(動画・説明文・台帳)の版。変われば確認をやり直す
function approveBar(item) {
  const a = S.approvals[item];
  const [t, cls] = approvalView(item);
  const comment = h("input", {type: "text", placeholder: "コメント(任意)", value: ""});  // 前回のコメントは持ち越さない
  watch(comment, "comment:" + item, () => comment.value !== "", false);
  const isVideo = item === "video";
  if (isVideo && checkedRev !== S.release_rev) { humanChecked.clear(); checkedRev = S.release_rev; }  // 確かめた後に変わった
  const send = (status) => (ev) => act(ev.target, () =>
    api("/api/approve", {item, status, comment: comment.value, hash: (S.hashes || {})[item] || "",
      expected: a ? (({stale, changed, ...rec}) => rec)(a) : null,
      ...(isVideo && status === "承認" ? {confirmed: [...humanChecked], release_rev: S.release_rev} : {})}).then(() => { humanChecked.clear(); drafts.delete("comment:" + item); }));
  const SRC_ERR = {plan: "brief"};  // 項目 → errors のキー
  const broken = !!S.errors.approvals || !!S.errors[SRC_ERR[item]];  // 承認記録・対象の正本が壊れている間は承認できない
  const rel = S.release || {checks: [], human: [], ok: true};
  const blocked = isVideo && (!rel.ok || S.video_kind !== "final" || rel.human.some((x) => !humanChecked.has(x.id)));
  const approveBtn = h("button", {class: "primary", "data-approve": "1", "data-broken": broken ? "1" : "0",
    "data-blocked": blocked ? "1" : "0", disabled: broken || blocked || dirty.size > 0, onclick: send("承認")}, "承認");
  const bar = h("div", {class: "panel approve"},
    h("strong", {}, isVideo ? "最終動画の承認:" : "構想の承認(着手の許可):"), h("span", {class: "st " + cls}, t),
    a && a.at ? h("span", {class: "small"}, a.at.replace("T", " ").slice(0, 19)) : null,
    comment, approveBtn,
    h("button", {class: "danger", "data-approve": "1", "data-broken": broken ? "1" : "0", disabled: broken || dirty.size > 0, onclick: send("要修正")}, "要修正"),
    h("span", {class: "small", id: "dirtyhint"}, ""),
    a && !broken ? h("button", {onclick: send("未承認")}, "取り消し") : null);
  if (!isVideo) return [bar];
  // 公開前チェック: 機械で確かめられる項目(自動)と、人が確かめる 4 項目(チェック)
  const refresh = () => {
    const bl = !rel.ok || S.video_kind !== "final" || rel.human.some((x) => !humanChecked.has(x.id));
    approveBtn.dataset.blocked = bl ? "1" : "0"; refreshApprove();
  };
  const panel = h("div", {class: "panel", id: "release"},
    h("strong", {}, "公開前チェック"),
    S.video_kind === "draft" ? h("div", {class: "banner"}, "表示中の動画は下書き(draft.mp4)です。承認できるのは最終動画(video.mp4。finish.py --final で作る)だけです。") : null,
    h("div", {}, rel.checks.map((c) => h("div", {class: c.ok ? "" : "err"},
      (c.ok ? "✓ " : "✗ ") + c.label + (c.detail ? "(" + c.detail + ")" : "")))),
    h("div", {class: "small", style: "margin-top:6px"}, "人が確かめる項目(機械では確かめられません):"),
    h("div", {}, rel.human.map((x) => {
      const box = h("input", {type: "checkbox", id: "hc-" + x.id, checked: humanChecked.has(x.id),
        onchange: (ev) => { if (ev.target.checked) humanChecked.add(x.id); else humanChecked.delete(x.id); refresh(); }});
      return h("label", {style: "display:block"}, box, " " + x.label);
    })));
  return [bar, panel];
}

// 壊れたファイルの警告(サーバの errors をすべて、どのタブでも先頭に出す)
const ERROR_LABELS = {approvals: "承認記録(approvals.json)", timestamps: "音声の時刻(timestamps.json)",
  notes: "指摘(notes.json)", script: "台本(narration.txt)", yomi: "読み(yomi.json)",
  assets: "素材台帳(assets.json)", brief: "構成案(brief.md)"};
function errorBanner() {
  const keys = Object.keys(S.errors);
  if (!keys.length) return [];
  return [h("div", {class: "banner bad"}, h("strong", {}, "読めないファイルがあります(直してから再読み込みしてください)"),
    keys.map((k) => h("div", {}, (ERROR_LABELS[k] || k) + ": " + S.errors[k])))];
}

// ── 台本 ──
const voice = document.getElementById("voice");
let stopAt = null;
voice.addEventListener("timeupdate", () => { if (stopAt != null && voice.currentTime >= stopAt) { voice.pause(); stopAt = null; } });
function playLine(l) {
  if (!S.script.audio || l.start_s == null) return;
  const rev = S.script.audio_rev || "";
  if (voice.dataset.rev !== rev) {  // 再合成で音声が差し替わったら、古い音声を使い続けない
    voice.src = fileUrl("/files/" + S.script.audio) + "?v=" + encodeURIComponent(rev); voice.dataset.rev = rev; voice.load();
  }
  voice.currentTime = l.start_s; stopAt = l.start_s + l.duration_s; voice.play();
}
const mmss = (s) => s == null ? "–" : Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");
// 指摘は行の本文に付く(キーは本文から作った ID)。台本の別の行が変わっても、行が増えても、同じ本文の行へついていく。
// 更新には、画面が見たこの指摘の記録(expected。無ければ null)と、指摘する行の本文(text)を添える。
const noteFor = (n) => S.notes.find((x) => x.line === n && !x.stale) || null;
const noteOf = (n) => (noteFor(n) || {}).note || "";
function noteBody(line, value, extra = {}, n = noteFor(line)) {
  const l = S.script.lines[line - 1];
  return {line, text: n ? n.text : (l ? l.text : ""), note: value, status: n ? n.status : "open", expected: n ? n.entry : null, ...extra};
}
function noteCell(line, placeholder) {
  const n = noteFor(line);
  const fixed = !!n && n.status === "fixed";
  const input = h("input", {type: "text", placeholder, value: noteOf(line), class: fixed ? "fixed" : "", disabled: fixed,
    title: n && n.moved ? "この行は、台本の行が増減して位置が変わりました(指摘は同じ本文の行についています)" : "",
    onchange: (ev) => act(ev.target, () => api("/api/note", noteBody(line, ev.target.value)))});
  watch(input, "note:" + ((S.script.lines[line - 1] || {}).text || line), () => input.value !== noteOf(line));
  const kids = [input];
  const set = (btn, status, msg) => act(btn, () => api("/api/note", noteBody(line, n.note, {status})), msg);
  if (n && !fixed) kids.push(h("button", {title: "直した指摘を『対応済み』(確認待ち)にします", onclick: (ev) => set(ev.target, "fixed", "対応済みにしました")}, "✓ 対応済み"));
  if (fixed) kids.push(h("span", {class: "small"}, "対応済み"),
    h("button", {onclick: (ev) => set(ev.target, "open", "未対応に戻しました")}, "戻す"),
    h("button", {onclick: (ev) => act(ev.target, () => api("/api/note", noteBody(line, "")), "消しました")}, "消す"));
  return h("div", {class: "notecell"}, ...kids);
}
// 未保存の入力があるうちは承認を止める(画面で直したつもりの内容と、承認される版を食い違わせない)
const dirty = new Set();
let keptNote = "";  // 直近の再描画で残した入力についての案内
function refreshApprove() {
  document.querySelectorAll("[data-approve]").forEach((b) => { b.disabled = b.dataset.broken === "1" || b.dataset.blocked === "1" || dirty.size > 0; });
  const hint = document.getElementById("dirtyhint");
  if (hint) hint.textContent = dirty.size ? "未保存の変更があります。先に保存してください" : "";
}
function markDirty(key, isDirty) { if (isDirty) dirty.add(key); else dirty.delete(key); refreshApprove(); }
// 未保存の入力(下書き)。キーは対象の本文・語・ファイル(行番号ではない)なので、行が増減しても同じ対象へ戻る。
// 画面を作り直しても、別のタブへ移っても、保存するか破棄するまで保つ。
const drafts = new Map();   // key → {value, base(入力を始めたときの元の値)}
const watched = new Map();  // key → {el, isDirty}(いまの描画の入力欄)
// blocks=false の入力(承認コメントなど)は、承認ボタンを止めない(下書きとしてだけ保つ)
function watch(el, key, isDirty, blocks = true) {
  watched.set(key, {el, isDirty});
  const upd = () => {
    const now = isDirty();
    if (blocks) markDirty(key, now);
    if (now) drafts.set(key, {value: el.value, base: el.defaultValue}); else drafts.delete(key);
  };
  for (const ev of ["input", "change"]) el.addEventListener(ev, upd);
}
// 下書きのキーが属するタブ(そのタブで対象の欄が見つからない下書きは、行き場が無い)
const OWNER = (k) => k.startsWith("n:") ? ["script"] : k.startsWith("note:") ? ["script", "video"]
  : /^(yr|ys|yn|yadd-)/.test(k) ? ["yomi"] : /^(as|an)/.test(k) ? ["assets"] : [];
const draftLabel = (k) => k.startsWith("n:") ? "本文(元の行: " + k.slice(2, 26) + "…)" : k.startsWith("note:") ? "指摘(元の行: " + k.slice(5, 29) + "…)" : k;
function orphanPanel(list) {
  return h("div", {class: "banner bad", id: "orphans"},
    h("strong", {}, "保存できなかった入力があります(対象の行・項目が変わったか、無くなりました)"),
    h("div", {class: "small"}, "内容を確かめて、必要なら対応する欄へ貼り付けてください。不要なら破棄します。"),
    list.map(([k, d]) => h("div", {}, h("span", {class: "small"}, draftLabel(k) + ": "), h("code", {}, d.value), " ",
      h("button", {onclick: () => { drafts.delete(k); render(); }}, "破棄"))));
}

function renderScript() {
  const out = [h("div", {class: "small"}, "承認は構成案と最終動画だけです。この画面での編集は承認に影響しません(動画ができてから、公開前チェックで確かめます)。")];
  if (S.script.stale) out.push(h("div", {class: "banner"},
    "台本が音声(timestamps.json)と食い違っています。直した行は再合成が必要です。"));
  const rows = S.script.lines.map((l) => {
    const ta = h("textarea", {rows: 2}, l.text);
    const save = h("button", {disabled: true, onclick: (ev) => act(ev.target, async () => {
      const r = await api("/api/narration", {index: l.index, text: ta.value, hash: (S.hashes || {}).script || ""});
      drafts.delete("n:" + l.text);  // 保存できた。本文が変わるのでキーも変わる(古い下書きを残さない)
      return r;
    })}, "本文を保存");
    ta.addEventListener("input", () => { save.disabled = ta.value.trim() === l.text; });
    watch(ta, "n:" + l.text, () => ta.value.trim() !== l.text);
    const note = noteCell(l.index + 1, "指摘(読み・同期・内容)");
    return h("tr", {},
      h("td", {}, String(l.index + 1)), h("td", {}, mmss(l.start_s)),
      h("td", {}, ta, h("div", {class: "reading"}, l.reading ? "読み: " + l.reading : ""), save),
      h("td", {}, h("button", {disabled: !S.script.audio || l.start_s == null,
        onclick: () => playLine(l)}, "▶ 聴く")),
      h("td", {}, note));
  });
  out.push(h("div", {class: "panel"},
    h("div", {class: "small"}, "本文を直して保存すると narration.txt が更新されます(直前の内容は narration.txt.bak)。"
      + "音声への反映は再合成が必要です。指摘は notes.json に保存されます。本文を直すと、その行の指摘は「古い」と示されます。"),
    h("table", {}, h("colgroup", {}, h("col", {class: "num"}), h("col", {class: "time"}), h("col", {}), h("col", {class: "narrow"}), h("col", {class: "note"})),
      h("thead", {}, h("tr", {}, ["#", "開始", "本文・読み", "音声", "指摘"].map((t) => h("th", {}, t)))),
      h("tbody", {}, rows))));
  const gone = S.notes.filter((n) => n.stale);
  if (gone.length) out.push(h("div", {class: "panel"},
    h("strong", {}, "古い指摘(その本文の行が台本から無くなった)"),
    h("div", {class: "small"}, "指摘した当時の本文を示します。自動では閉じません。内容を確かめて、直っていれば対応済みにするか、消してください。"),
    h("table", {}, h("tbody", {}, gone.map((n) => h("tr", {},
      h("td", {}, n.line + " 行目"), h("td", {}, "当時: " + n.text), h("td", {}, n.note),
      h("td", {}, n.status === "fixed" ? "対応済み" : h("button", {onclick: (ev) => act(ev.target, () => api("/api/note", noteBody(n.line, n.note, {status: "fixed"}, n)), "対応済みにしました")}, "✓ 対応済み")),
      h("td", {}, h("button", {onclick: (ev) => act(ev.target, () => api("/api/note", noteBody(n.line, "", {}, n)), "消しました")}, "消す"))))))));
  return out;
}

// ── 読み ──
function yomiRow(y) {
  const reading = h("input", {type: "text", value: y.reading, size: 18});
  const status = h("select", {}, ["確認済み", "候補"].map((s) => h("option", {value: s, selected: s === y.status}, s)));
  const note = h("input", {type: "text", value: y.note});
  watch(reading, "yr" + y.surface, () => reading.value !== y.reading);
  watch(status, "ys" + y.surface, () => status.value !== y.status);
  watch(note, "yn" + y.surface, () => note.value !== y.note);
  const save = h("button", {onclick: (ev) => act(ev.target, () =>
    api("/api/yomi", {surface: y.surface, reading: reading.value, status: status.value, note: note.value, expected: y.entry}))}, "保存");
  const del = h("button", {onclick: (ev) => { if (confirm(`「${y.surface}」を削除しますか`))
    act(ev.target, () => api("/api/yomi/delete", {surface: y.surface, expected: y.entry})); }}, "削除");
  return h("tr", {class: y.status === "候補" ? "cand" : ""},
    h("td", {}, y.surface), h("td", {}, reading), h("td", {}, status), h("td", {}, note), h("td", {}, save, " ", del));
}
function renderYomi() {
  const out = [h("div", {class: "small"}, "承認は構成案と最終動画だけです。この画面での編集は承認に影響しません(動画ができてから、公開前チェックで確かめます)。")];
  const sf = h("input", {type: "text", placeholder: "表記(例: RANSAC)"});
  const rd = h("input", {type: "text", placeholder: "読み(例: ラ'ンサック)"});
  watch(sf, "yadd-s", () => sf.value !== "", false);
  watch(rd, "yadd-r", () => rd.value !== "", false);
  const add = h("button", {onclick: (ev) => act(ev.target, async () => {
    await api("/api/yomi", {surface: sf.value, reading: rd.value, status: "確認済み", note: "", expected: null});
    sf.value = ""; rd.value = ""; drafts.delete("yadd-s"); drafts.delete("yadd-r");
  })}, "追加");
  out.push(h("div", {class: "panel"},
    h("div", {class: "small"}, "読みは全角カタカナで、アクセント核の直後に ' を 1 つ(無ければ平板)。"
      + "状態が「候補」の語は台本検査が止め、合成にも使われません。この動画の辞書(yomi.json)だけを直します。"),
    h("div", {class: "small"}, S.yomi_layers.join(" / ")),
    h("table", {}, h("thead", {}, h("tr", {}, ["表記", "読み", "状態", "メモ", ""].map((t) => h("th", {}, t)))),
      h("tbody", {}, S.yomi.map(yomiRow))),
    h("div", {class: "approve", style: "margin-top:10px"}, sf, rd, add)));
  return out;
}

// ── 素材 ──
function assetCard(a) {
  const media = !a.exists ? h("div", {class: "err"}, "ファイルが見つかりません")
    : a.kind === "image" ? h("img", {src: fileUrl(a.url), alt: a["ファイル"], loading: "lazy"})
    : a.kind === "video" ? h("video", {src: fileUrl(a.url), controls: true, preload: "metadata"})
    : h("a", {href: fileUrl(a.url), target: "_blank", rel: "noopener"}, "開く");
  const status = h("select", {}, ["確認済み", "出典表示", "仮"].map((s) => h("option", {value: s, selected: s === a["状態"]}, s)));
  const note = h("input", {type: "text", placeholder: "メモ", value: a["メモ"]});
  watch(status, "as" + a["ファイル"], () => status.value !== a["状態"]);
  watch(note, "an" + a["ファイル"], () => note.value !== a["メモ"]);
  const save = h("button", {onclick: (ev) => act(ev.target, () =>
    api("/api/asset", {file: a["ファイル"], status: status.value, note: note.value, expected: a.entry}))}, "保存");
  const src = /^https?:\/\//.test(a["出典URL"]) ? h("a", {href: a["出典URL"], target: "_blank", rel: "noopener noreferrer"}, "出典を開く") : "出典URLなし";
  return h("div", {class: "card"}, media,
    h("div", {}, h("strong", {}, a["ファイル"]), " ", h("span", {class: "small"}, a["場面"])),
    h("div", {class: "small"}, "画面に出る出典: " + a.credit),
    a["種別"] ? h("div", {class: "small"}, `種別: ${a["種別"]}` + (a["書誌"] ? ` / 書誌: ${a["書誌"]}` : "") + (a["位置"] ? ` / 位置: ${a["位置"]}` : "")) : "",
    h("div", {class: "small"}, `作者: ${a["作者"] || "?"} / ライセンス: ${a["ライセンス"] || "?"} / 取得日: ${a["取得日"] || "?"}`),
    h("div", {class: "small"}, src),
    h("div", {class: "row"}, "状態", status, note, save));
}
function renderAssets() {
  const out = [h("div", {class: "small"}, "承認は構成案と最終動画だけです。この画面での編集は承認に影響しません(動画ができてから、公開前チェックで確かめます)。")];
  out.push(h("div", {class: "panel"},
    h("div", {class: "small"}, "確認済み=許諾あり / 出典表示=許諾は未確認だが出典を出して使う / 仮=私的な検証だけ。"
      + "条件は references/attribution.md。"),
    S.assets.length ? h("div", {class: "grid"}, S.assets.map(assetCard)) : h("p", {}, "素材台帳(assets.json)はありません。")));
  return out;
}

// ── 動画 ──
// 動画の要素は再描画をまたいで使い回す(保存のたびに作り直すと、再生位置が 0 に戻る)。
// 動画ファイルが差し替わったときだけ作り直し、同じ位置から続ける。
let videoEl = null, videoVersion = null;
function videoElement() {
  const version = S.video + ":" + (S.video_rev || "");  // 差し替え(再生成)を見つける
  if (videoEl && videoVersion === version) return videoEl;
  const resumeAt = videoEl ? videoEl.currentTime : 0;
  const v = h("video", {class: "player", src: fileUrl("/files/" + S.video), controls: true, preload: "metadata"});
  if (resumeAt > 0) v.addEventListener("loadedmetadata", () => { v.currentTime = Math.min(resumeAt, v.duration || resumeAt); }, {once: true});
  v.addEventListener("timeupdate", () => {
    const cur = S.script.lines.filter((l) => l.start_s != null && l.start_s <= v.currentTime).pop();
    document.querySelectorAll("tr.cur").forEach((r) => r.classList.remove("cur"));
    if (cur) document.getElementById("vl" + cur.index)?.classList.add("cur");
  });
  videoEl = v; videoVersion = version;
  return v;
}
function renderVideo() {
  const out = [...approveBar("video")];
  if (!S.video) { out.push(h("div", {class: "panel"}, "動画(video.mp4 / draft.mp4)がまだありません。build.py で下書きを作れます。")); return out; }
  const v = videoElement();
  const rows = S.script.lines.map((l) => h("tr", {id: "vl" + l.index},
    h("td", {}, h("a", {href: "#", onclick: (ev) => { ev.preventDefault(); if (l.start_s != null) { v.currentTime = l.start_s; v.play(); } }}, mmss(l.start_s))),
    h("td", {}, String(l.index + 1)), h("td", {}, l.text),
    h("td", {}, noteCell(l.index + 1, "指摘"))));
  out.push(h("div", {class: "panel"}, v,
    h("div", {class: "small", style: "margin:6px 0"}, "時刻のリンクでその行へ移動します。気になった行に指摘を書くと notes.json に保存されます。"),
    h("table", {}, h("thead", {}, h("tr", {}, ["開始", "#", "本文", "指摘"].map((t) => h("th", {}, t)))), h("tbody", {}, rows))));
  return out;
}

// ── 構成案 ──
function renderPlan() {
  return [...approveBar("plan"), h("div", {class: "panel"},
    S.brief ? h("pre", {}, S.brief) : "brief.md がまだありません(取材と構成案の記録は brief.md に書かれます)。")];
}

function render() {
  // 再描画で入力欄は作り直される。未保存の下書き(drafts)は、同じ対象の新しい欄へ戻す
  dirty.clear(); watched.clear();
  renderHeader();
  const wasPlaying = videoEl && !videoEl.paused && !videoEl.ended;
  const main = document.getElementById("main"); main.replaceChildren();
  const view = {script: renderScript, yomi: renderYomi, assets: renderAssets, video: renderVideo, plan: renderPlan}[tab];
  const nodes = view();
  let kept = 0, clash = 0;
  for (const [k, d] of [...drafts]) {
    const w = watched.get(k);
    if (!w) continue;
    if (w.el.value === d.value) { if (!w.isDirty()) drafts.delete(k); continue; }  // 保存済み、または変わっていない
    const moved = w.el.defaultValue !== d.base;  // 入力中の欄の元の値も、外で変わっていた
    w.el.value = d.value; w.el.classList.add(moved ? "conflict" : "draft");
    if (moved) w.el.title = "この欄は外でも変更されています。確かめてから保存してください";
    w.el.dispatchEvent(new Event("input", {bubbles: true}));
    kept++; if (moved) clash++;
  }
  const orphans = [...drafts].filter(([k]) => OWNER(k).includes(tab) && !watched.has(k));
  main.append(...errorBanner(), ...(orphans.length ? [orphanPanel(orphans)] : []), ...nodes);
  // 要素を外すと再生が止まる。再生中だったなら続ける
  if (wasPlaying && tab === "video" && videoEl.isConnected) videoEl.play().catch(() => {});
  keptNote = kept ? (`入力中の内容(${kept} 件)は残しています。` + (clash ? `${clash} 件は外でも変更されています。確かめてから保存してください` : "確かめて、もう一度保存してください")) : "";
}
load(false).catch((e) => document.getElementById("main").append(h("div", {class: "banner bad"}, "読み込みに失敗: " + e.message)));
</script>
