session_name: IDE
shell_command_before:
  - 'eval "$(mise activate zsh)"'
start_directory: "${PWD}"
windows:
  - window_name: editor
    layout: main-vertical
    panes:
      - yazi
      - agent
      - zsh

  - window_name: git
    panes:
      - shell_command:
          - lazygit

  - window_name: monitor
    layout: main-vertical
    panes:
      - btop
      - nvitop
      - ctop
