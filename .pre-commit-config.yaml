---
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.28.0
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: yamllint-local
        name: YAML Lint via uvx
        entry: mise exec -- uvx yamllint
        language: system
        files: \.(yaml|yml)$
        args: [--strict]

      # --force-exclude が無いと、pre-commit がファイル名を明示的に渡すため
      # pyproject.toml の extend-exclude (upstream 由来のコード) が無視される。
      - id: ruff-local
        name: Python Lint via uvx
        entry: mise exec -- uvx ruff@0.16.5 check --force-exclude
        language: system
        types_or: [python, pyi]

      - id: markdownlint-local
        name: Markdown Lint via mise
        entry: mise exec -- markdownlint-cli2
        language: system
        files: \.(md|markdown)$

      # SKILL.md の frontmatter が壊れても CLI は起動時に
      # "Failed to load 1 skill." としか言わないので、ここで先に弾く。
      - id: skill-frontmatter-local
        name: Skill frontmatter check
        entry: >-
          mise exec -- uv run --with pyyaml --no-project
          python scripts/agents/validate_skills.py
        language: system
        files: ^home/[^/]+/skills/[^/]+/SKILL\.md$

      # common.toml は chezmoi テンプレートなので check-toml が使えない。
      # hook が fail-closed で読む正本なので、描画結果を検査して代替する。
      # (TOML として読めるかは lint-templates-local でも見る。こちらは
      #  ポリシー固有のスキーマが主目的)
      - id: common-toml-local
        name: Rendered common.toml check
        entry: mise exec -- python3 scripts/agents/validate_common.py
        language: system
        pass_filenames: false
        files: ^(home/dot_config/agents/common\.toml\.tmpl|scripts/agents/(generate|validate_common)\.py)$

      # identify は *.tmpl に何のタグも付けないため、check-toml / ruff /
      # shellcheck がテンプレートを素通りする。描画してから振り分ける。
      - id: lint-templates-local
        name: Lint rendered chezmoi templates
        entry: mise exec -- python3 scripts/lint_templates.py
        language: system
        pass_filenames: false
        files: (\.tmpl|^scripts/lint_templates\.py)$

      # 索引と実ファイルの整合。索引が腐ると docs 全体が腐るので機械に見せる。
      # 検査するのは整合だけで、記述の妥当性は判定しない。
      - id: lint-docs-local
        name: Lint docs index consistency
        entry: mise exec -- python3 scripts/lint_docs.py
        language: system
        pass_filenames: false
        files: ^(docs/.*\.md|scripts/lint_docs\.py)$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        name: Check YAML syntax
      - id: check-toml
        name: Check TOML syntax
        exclude: ^home/dot_codex/modify_config\.toml$
      - id: end-of-file-fixer
        name: Fix end of files
      - id: trailing-whitespace
        name: Trim trailing whitespace
